slug: spice_route
name: Spice Route Foods
vertical_pack: cloud_kitchen

brands:
  - {slug: biryani_box, name: Biryani Box}
  - {slug: midnight_pizza, name: Midnight Pizza Co.}
  - {slug: bowl_theory, name: Bowl Theory}

locations:
  - {slug: kharadi, name: Kharadi kitchen, brands: [biryani_box, midnight_pizza, bowl_theory]}

feature_flags:
  growth: false

# Overrides of vertical-pack settings. Limits may only be lowered at brand/location level.
settings:
  org:
    refund_channel: tenant_gateway
  brands:
    bowl_theory:
      voucher_auto_approve_max_paise: 10000
  locations: {}

# Dev/demo login password for the users below (a user may override it with its own
# demo_password). Hashed into the DB only with DEMO_AUTH=true; never a real credential.
demo_password: spice-route-demo

# Demo users. No scope = whole org.
users:
  - {email: owner@spiceroute.test, name: Asha Kulkarni, role: hq_owner}
  - {email: kharadi.manager@spiceroute.test, name: Rohit Shinde, role: location_manager, locations: [kharadi]}
  - {email: riya@customer.test, name: Riya M., role: customer}
  - {email: kabir@customer.test, name: Kabir S., role: customer}

# History for `make seed` (simulator/). Rates are assumptions, see docs/research/market.md.
simulation:
  end_date: 2026-09-30
  days: 60
  customers: 1500
  orders: 6000
  past_tickets: 300
  hours: [11, 24]
  items_per_order: [1, 3]
  promise_minutes: [30, 45]
  delay_minutes: [-10, 25]
  problems:
    - {kind: late, rate: 0.08, extra_minutes: [46, 90]}
    - {kind: missing_item, rate: 0.02}
  messy:
    duplicate_phone_rate: 0.03
    orders_outside_window: 25
  ticket_categories: {late: late_delivery, missing_item: missing_items}
