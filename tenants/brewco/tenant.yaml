slug: brewco
name: BrewCo
vertical_pack: coffee_chain

brands:
  - {slug: brewco_coffee, name: BrewCo Coffee}

# Koregaon Park is HQ-owned; franchisee A runs Baner + Viman Nagar, franchisee B runs Aundh + Kothrud.
locations:
  - {slug: koregaon_park, name: Koregaon Park, brands: [brewco_coffee]}
  - {slug: baner, name: Baner, brands: [brewco_coffee]}
  - {slug: viman_nagar, name: Viman Nagar, brands: [brewco_coffee]}
  - {slug: aundh, name: Aundh, brands: [brewco_coffee]}
  - {slug: kothrud, name: Kothrud, brands: [brewco_coffee]}

feature_flags:
  growth: true

settings:
  org:
    voucher_auto_approve_max_paise: 10000
  brands: {}
  locations:
    baner:
      refund_without_escalation_paise: 30000

users:
  - {email: owner@brewco.test, name: Meera Iyer, role: hq_owner}
  - {email: franchisee.a@brewco.test, name: Vikram Rao, role: franchisee_owner, locations: [baner, viman_nagar]}
  - {email: franchisee.b@brewco.test, name: Sana Shaikh, role: franchisee_owner, locations: [aundh, kothrud]}
  - {email: kp.manager@brewco.test, name: Arjun Mehta, role: location_manager, locations: [koregaon_park]}
  - {email: baner.manager@brewco.test, name: Neha Joshi, role: location_manager, locations: [baner]}
  - {email: kothrud.manager@brewco.test, name: Omkar Patil, role: location_manager, locations: [kothrud]}
  - {email: dev@customer.test, name: Dev P., role: customer}
  - {email: ananya@customer.test, name: Ananya K., role: customer}

# History for `make seed` (simulator/). Rates are assumptions, see docs/research/market.md.
simulation:
  end_date: 2026-09-30
  days: 60
  customers: 2500
  orders: 15000
  past_tickets: 400
  hours: [7, 22]
  items_per_order: [1, 3]
  promise_minutes: [5, 12]
  delay_minutes: [-3, 8]
  source_weights: {pos: 0.7, pickup_app: 0.3}
  location_weights: {koregaon_park: 1.3, baner: 1.0, viman_nagar: 1.0, aundh: 0.9, kothrud: 0.9}
  problems:
    - {kind: wrong_item, rate: 0.02}
    # Planted: Baner gets 3x wrong orders on weekday mornings, and loses regulars from day 35.
    - {kind: wrong_item, rate: 0.06, location: baner, hours: [8, 10], weekdays_only: true}
    - {kind: repeat_drop, location: baner, from_day: 35, factor: 0.5}
  messy:
    multi_location_customer_rate: 0.15
    opted_out_rate: 0.10
  ticket_categories: {wrong_item: wrong_order, missing_item: missing_items}
